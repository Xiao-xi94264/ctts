server:
  port: 8080

spring:
  application:
    name: ctts

  datasource:
    url: jdbc:mysql://localhost:3306/ctts?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 111

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ctts.mapper: debug

ctts:
  jwt:
    secret: ctts-campus-training-task-system-jwt-secret-2026
    expire: 7200000   # token 有效期 2 小时（毫秒）
