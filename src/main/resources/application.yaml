server:
  port: 8080
  servlet:
    # 统一前缀 /api（D1 决策，2026-11-28）。放在 context-path 而不是逐个 Controller 的
    # @RequestMapping：前缀是"部署属性"，不是业务属性。
    # 三个连带影响：① 所有外部地址变为 http://localhost:8080/api/xxx；
    # ② doc.html 变 /api/doc.html（WebConfig 里的白名单写的是应用内路径，不用改）；
    # ③ MockMvc 测试不受影响——它绕过 Servlet 容器映射，get("/users") 仍然匹配。
    context-path: /api

spring:
  application:
    name: ctts

  datasource:
    # characterEncoding 取的是 Java 字符集名（UTF-8），不是 MySQL 的 utf8mb4
    # Connector/J 8.x 会把 UTF-8 协商成 utf8mb4；connectionCollation 显式锁定排序规则
    url: jdbc:mysql://localhost:3306/ctts?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 111

  jackson:
    # 注意：这一项只对 java.util.Date 生效，对 LocalDateTime/LocalDate 无效。
    # java.time 的格式由 com.ctts.config.JacksonConfig 统一接管（类型级序列化器）。
    # 项目已无 java.util.Date 字段，这两行留着是为了以后引入 Date 时行为可预期。
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ctts.mapper: debug
    # 登录会走 selectByUsername，MyBatis 的 debug 会把参数逐个打印 → 明文密码进日志
    # 日志级别可按 logger 名做树状覆盖，此处只让 UserMapper 闭嘴，其它 Mapper 照常看 SQL
    com.ctts.mapper.UserMapper: info

ctts:
  jwt:
    secret: ctts-campus-training-task-system-jwt-secret-2026
    expire: 7200000   # token 有效期 2 小时（毫秒）
